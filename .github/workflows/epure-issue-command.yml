name: "EPURE Issue Command Gate"
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
jobs:
  authorize-and-dispatch:
    uses: Giskard-AI/epure/.github/workflows/issue-command.yml@4d177229e30b06e315dadd8935592a1fa8de8bfe # v1.1.0
    with:
      repository: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
      comment_body: ${{ github.event.comment.body }}
      actor: ${{ github.event.comment.user.login }}
      actor_type: ${{ github.event.comment.user.type }}
    secrets:
      EPURE_AGENT_APP_ID: ${{ secrets.EPURE_AGENT_APP_ID }}
      EPURE_AGENT_APP_PRIVATE_KEY: ${{ secrets.EPURE_AGENT_APP_PRIVATE_KEY }}
