name: "EPURE Controlled Release (dev -> main)"
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Immutable SemVer tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Verify Release App boundary
        uses: Giskard-AI/epure/actions/verify-app-role@cdf2ae6a470583864db79ba41625f37b47a2a12f # v1.1.0
        with:
          app_role: "release"
          operation: "promote_dev_to_main"
          target_ref: "refs/heads/main"
          workflow_path: ".github/workflows/release.yml"
          environment_name: "release"
